name: Public artifact-free tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MLFLOW_ENABLE_SYSTEM_METRICS_LOGGING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-public.txt
            constraints-public.txt
      - name: Check the source snapshot
        run: python -B scripts/check_public_snapshot.py
      - name: Install public CPU dependencies
        run: python -m pip install -r requirements-public.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run public tests without private artifacts
        run: python -B -m pytest -q
